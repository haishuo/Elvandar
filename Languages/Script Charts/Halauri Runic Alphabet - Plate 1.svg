<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1020" viewBox="0 0 1440 1020">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11161a"/>
      <stop offset="0.55" stop-color="#1b2023"/>
      <stop offset="1" stop-color="#111316"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d59a"/>
      <stop offset="0.45" stop-color="#c89b50"/>
      <stop offset="1" stop-color="#8f642d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title { font: 700 38px Georgia, serif; fill: #f0dfbd; letter-spacing: 2px; }
      .subtitle { font: 16px Georgia, serif; fill: #b9aa8d; }
      .cell { fill: #1d2326; stroke: #5b4a32; stroke-width: 1.5; }
      .cell-vowel { fill: #18272a; stroke: #55777a; stroke-width: 1.5; }
      .code { font: 700 15px Helvetica, Arial, sans-serif; fill: #c9b996; letter-spacing: 1px; }
      .name { font: italic 700 19px Georgia, serif; fill: #f0dfbd; }
      .operator { font: 700 11px Helvetica, Arial, sans-serif; fill: #a99775; letter-spacing: 1.2px; }
      .note { font: 15px Georgia, serif; fill: #b9aa8d; }
      .tiny { font: 12px Helvetica, Arial, sans-serif; fill: #88795f; letter-spacing: 0.5px; }
      .rune { color: #d7ae62; filter: url(#glow); }
      .rune-vowel { color: #74b5b2; filter: url(#glow); }
    </style>

    <!-- Stop series: tooth height marks place; short counter-stroke marks the voiced partner. -->
    <g id="p" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 16L54 30L22 44" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="b" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 16L54 30L22 44 M8 74H22" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="t" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 30L54 46L22 62" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="d" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 30L54 46L22 62 M8 74H22" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="k" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 46L54 62L22 78" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="g" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 46L54 62L22 78 M8 26H22" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
