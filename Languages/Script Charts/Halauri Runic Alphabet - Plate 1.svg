    <!-- Fricatives: paired open cuts; mirror and voicing marks distinguish related values. -->
    <g id="f" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 16L54 26 M22 34L54 44" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="v" transform="scale(1.03125 0.7708333)"><path d="M22 8V88 M22 16L54 26 M22 34L54 44 M8 74H22" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
