  <g transform="translate(1180 650)"><rect width="210" height="155" rx="8" class="cell-vowel"/><text x="14" y="24" class="code">E · /e/</text><use xlink:href="#e" x="72" y="30" width="66" height="74" class="rune-vowel"/><text x="105" y="126" text-anchor="middle" class="name">Esh</text><text x="105" y="146" text-anchor="middle" class="operator">CONDITION</text></g>

