    <g id="sh" transform="scale(1.03125 0.7708333)"><path d="M32 8V88 M32 26L8 40 M32 26L56 40 M32 56L8 70 M32 56L56 70" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
