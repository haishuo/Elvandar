  <g transform="translate(260 475)"><rect width="210" height="155" rx="8" class="cell"/><text x="14" y="24" class="code">SH · /ʃ/</text><use xlink:href="#sh" x="72" y="30" width="66" height="74" class="rune"/><text x="105" y="126" text-anchor="middle" class="name">Sha</text><text x="105" y="146" text-anchor="middle" class="operator">BRANCH</text></g>
  <g transform="translate(490 475)"><rect width="210" height="155" rx="8" class="cell"/><text x="14" y="24" class="code">X · /ɕ/</text><use xlink:href="#x" x="72" y="30" width="66" height="74" class="rune"/><text x="105" y="126" text-anchor="middle" class="name">Xel</text><text x="105" y="146" text-anchor="middle" class="operator">ALIGN</text></g>
