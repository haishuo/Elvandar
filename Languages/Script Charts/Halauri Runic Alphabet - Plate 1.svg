    <g id="h" transform="scale(1.03125 0.7708333)"><path d="M14 8V88 M50 8V88 M14 66L50 30" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>

    <!-- Sonorants and glides use continuous or paired paths. -->
    <g id="m" transform="scale(1.03125 0.7708333)"><path d="M8 86V16L32 44L56 16V86" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="n" transform="scale(1.03125 0.7708333)"><path d="M10 86V16L54 78V10" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="l" transform="scale(1.03125 0.7708333)"><path d="M18 8V70L52 88 M18 70L42 52" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
