  <g transform="translate(720 300)"><rect width="210" height="155" rx="8" class="cell"/><text x="14" y="24" class="code">S · /s/</text><use xlink:href="#s" x="72" y="30" width="66" height="74" class="rune"/><text x="105" y="126" text-anchor="middle" class="name">Sel</text><text x="105" y="146" text-anchor="middle" class="operator">TRANSFER</text></g>
  <g transform="translate(950 300)"><rect width="210" height="155" rx="8" class="cell"/><text x="14" y="24" class="code">Z · /z/</text><use xlink:href="#z" x="72" y="30" width="66" height="74" class="rune"/><text x="105" y="126" text-anchor="middle" class="name">Zen</text><text x="105" y="146" text-anchor="middle" class="operator">RECORD</text></g>
  <g transform="translate(1180 300)"><rect width="210" height="155" rx="8" class="cell"/><text x="14" y="24" class="code">TH · /θ/</text><use xlink:href="#th" x="72" y="30" width="66" height="74" class="rune"/><text x="105" y="126" text-anchor="middle" class="name">Thum</text><text x="105" y="146" text-anchor="middle" class="operator">SUSTAIN</text></g>

