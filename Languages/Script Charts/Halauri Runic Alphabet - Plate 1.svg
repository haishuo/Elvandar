  <g transform="translate(735 825)">
    <rect width="655" height="155" rx="8" fill="#15191c" stroke="#403a30" stroke-width="1.5"/>
    <text x="24" y="36" class="code">OPERATIVE RULE</text>
    <text x="24" y="67" class="note">A rune has an operative value, but no free power.</text>
    <text x="24" y="94" class="note">Execution requires exact geometry + binding frame + host + charge.</text>
