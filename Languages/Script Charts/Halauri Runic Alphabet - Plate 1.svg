  <g transform="translate(720 650)"><rect width="210" height="155" rx="8" class="cell"/><text x="14" y="24" class="code">Y · /j/</text><use xlink:href="#y" x="72" y="30" width="66" height="74" class="rune"/><text x="105" y="126" text-anchor="middle" class="name">Yar</text><text x="105" y="146" text-anchor="middle" class="operator">ASSEMBLE</text></g>
