    <g id="w" transform="scale(1.03125 0.7708333)"><path d="M6 12L18 86L32 50L46 86L58 12" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="y" transform="scale(1.03125 0.7708333)"><path d="M8 10L32 44L56 10 M32 44V88 M18 68H46" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>

    <!-- Freestanding vowel forms. -->
    <g id="a" transform="scale(1.03125 0.7708333)"><path d="M32 8L58 88 M32 8L6 88 M16 58H48" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="e" transform="scale(1.03125 0.7708333)"><path d="M32 8L56 32L32 56L8 32Z M32 56V88 M18 72H46" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="i" transform="scale(1.03125 0.7708333)"><path d="M32 8V88 M14 8H50 M14 88H50 M20 48H44" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
    <g id="o" transform="scale(1.03125 0.7708333)"><path d="M32 6L58 48L32 90L6 48Z M18 48H46" stroke="currentColor" fill="none" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter"/></g>
